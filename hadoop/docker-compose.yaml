version: '3.8'

services:
  namenode:
    image: apache/hadoop:3.4.2
    container_name: namenode
    hostname: namenode
    user: root
    restart: always
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # NameNode RPC
    volumes:
      - hadoop_namenode:/opt/hadoop/dfs/name
      - ./config:/opt/hadoop/etc/hadoop
    environment:
      - ENSURE_NAMENODE_DIR=/opt/hadoop/dfs/name
    command: ["hdfs", "namenode"]
    networks:
      - hadoop

  datanode1:
    image: apache/hadoop:3.4.2
    container_name: datanode1
    hostname: datanode1
    user: root
    restart: always
    volumes:
      - hadoop_datanode1:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  datanode2:
    image: apache/hadoop:3.4.2
    container_name: datanode2
    hostname: datanode2
    user: root
    restart: always
    volumes:
      - hadoop_datanode2:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  datanode3:
    image: apache/hadoop:3.4.2
    container_name: datanode3
    hostname: datanode3
    user: root
    restart: always
    volumes:
      - hadoop_datanode3:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  resourcemanager:
    image: apache/hadoop:3.4.2
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    restart: always
    ports:
      - "8088:8088"   # ResourceManager Web UI
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
    networks:
      - hadoop

  nodemanager1:
    image: apache/hadoop:3.4.2
    container_name: nodemanager1
    hostname: nodemanager1
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager2:
    image: apache/hadoop:3.4.2
    container_name: nodemanager2
    hostname: nodemanager2
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager3:
    image: apache/hadoop:3.4.2
    container_name: nodemanager3
    hostname: nodemanager3
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  historyserver:
    image: apache/hadoop:3.4.2
    container_name: historyserver
    hostname: historyserver
    user: root
    restart: always
    ports:
      - "8188:8188"   # History Server Web UI
    volumes:
      - hadoop_historyserver:/opt/hadoop/yarn/timeline
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "timelineserver"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  hadoop_historyserver:

networks:
  hadoop:
    driver: bridge