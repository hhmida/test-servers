---
# ════════════════════════════════════════════════════════════════
# Variables globales – BigData Cluster (Docker)
# ════════════════════════════════════════════════════════════════

cluster_name: bigdata-cluster
hadoop_user:  hadoop
hadoop_group: hadoop

### Répertoires
install_dir: /opt/bigdata
data_dir:    /data
log_dir:     /var/log/bigdata
pid_dir:     /var/run/bigdata

### Java 17 (Ubuntu 24.04)
java_home: /usr/lib/jvm/java-17-openjdk-amd64

### ─── Versions ────────────────────────────────────────────────
hadoop_version:     "3.3.6"
spark_version:      "3.5.1"
hive_version:       "3.1.3"
hbase_version:      "2.5.8"
phoenix_version:    "5.1.3"
kafka_version:      "3.7.0"
scala_version:      "2.13"
zookeeper_version:  "3.8.4"
nifi_version:       "1.25.0"
atlas_version:      "2.3.0"
ranger_version:     "2.4.0"
prometheus_version: "2.51.0"
grafana_version:    "10.3.3"

### ─── Miroirs ─────────────────────────────────────────────────
# Note : les binaires sont déjà pré-installés dans les images Docker.
# Les URLs sont conservées pour une éventuelle mise à jour en live.
apache_mirror: "https://archive.apache.org/dist"
hadoop_url:    "{{ apache_mirror }}/hadoop/common/hadoop-{{ hadoop_version }}/hadoop-{{ hadoop_version }}.tar.gz"
spark_url:     "{{ apache_mirror }}/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
hive_url:      "{{ apache_mirror }}/hive/hive-{{ hive_version }}/apache-hive-{{ hive_version }}-bin.tar.gz"
hbase_url:     "{{ apache_mirror }}/hbase/{{ hbase_version }}/hbase-{{ hbase_version }}-bin.tar.gz"
kafka_url:     "{{ apache_mirror }}/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
zookeeper_url: "{{ apache_mirror }}/zookeeper/zookeeper-{{ zookeeper_version }}/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
nifi_url:      "{{ apache_mirror }}/nifi/{{ nifi_version }}/nifi-{{ nifi_version }}-bin.zip"
atlas_url:     "{{ apache_mirror }}/atlas/{{ atlas_version }}/apache-atlas-{{ atlas_version }}-server.tar.gz"
ranger_url:    "{{ apache_mirror }}/ranger/{{ ranger_version }}/apache-ranger-{{ ranger_version }}-admin.tar.gz"

### ─── Réseau Docker ───────────────────────────────────────────
namenode_host:            master1
namenode_ip:              "172.20.0.11"
secondary_namenode_host:  master2
secondary_namenode_ip:    "172.20.0.12"
resourcemanager_host:     master1
hive_host:                master2
hbase_master_host:        master2
zookeeper_host:           master1
kafka_host:               master1
nifi_host:                edge
nifi_http_port:           8080
atlas_host:               master2
ranger_host:              master2
ranger_ip:                "172.20.0.12"
edge_host:                edge
edge_ip:                  "172.20.0.31"

### ─── HDFS ────────────────────────────────────────────────────
hdfs_replication_factor: 2
hdfs_block_size:         134217728
hdfs_namenode_dir:       "{{ data_dir }}/hdfs/namenode"
hdfs_datanode_dir:       "{{ data_dir }}/hdfs/datanode"
hdfs_secondary_dir:      "{{ data_dir }}/hdfs/secondary"

### ─── HDFS Erasure Coding ─────────────────────────────────────
hdfs_ec_enabled:         true
hdfs_ec_policy_default:  "RS-3-2-1024k"
hdfs_ec_policy_archive:  "RS-6-3-1024k"
hdfs_ec_paths:
  - { path: "/data/cold",    policy: "RS-3-2-1024k" }
  - { path: "/data/archive", policy: "RS-6-3-1024k" }

### ─── YARN ────────────────────────────────────────────────────
yarn_nodemanager_memory_mb:       20480
yarn_nodemanager_vcores:          6
yarn_scheduler_min_allocation_mb: 512
yarn_scheduler_max_allocation_mb: 16384

### ─── Spark ───────────────────────────────────────────────────
spark_driver_memory:   "4g"
spark_executor_memory: "4g"
spark_executor_cores:  2

### ─── Kafka ───────────────────────────────────────────────────
kafka_log_dir:           "{{ data_dir }}/kafka/logs"
kafka_num_partitions:    4
kafka_replication_factor: 1

### ─── ZooKeeper ───────────────────────────────────────────────
zookeeper_data_dir:    "{{ data_dir }}/zookeeper"
zookeeper_client_port: 2181

### ─── Ranger ──────────────────────────────────────────────────
ranger_admin_port:     6080
ranger_admin_user:     admin
ranger_admin_password: "RangerAdmin@2024!"
ranger_db_type:        derby

### ─── Cockpit ─────────────────────────────────────────────────
cockpit_port: 9090

### ─── Monitoring ──────────────────────────────────────────────
prometheus_port: 9090
grafana_port:    3000

### ─── Docker-specific ─────────────────────────────────────────
# Les binaires sont pré-installés dans les images ; les rôles Ansible
# vérifient leur présence avant de télécharger.
binaries_preinstalled: true
docker_mode: true
