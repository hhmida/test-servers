
# ════════════════════════════════════════════════════════════════
# Inventaire Ansible – Cluster Docker
# IPs : réseau bridge bigdata-net (172.20.0.0/24)
# SSH : port 22 (dans le réseau Docker)
# ════════════════════════════════════════════════════════════════

[all:vars]
ansible_user=hadoop
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_ssh_timeout=30

[masters]
master1 ansible_host=172.20.0.11
master2 ansible_host=172.20.0.12

[workers]
worker1 ansible_host=172.20.0.21
worker2 ansible_host=172.20.0.22

[edge]
edge ansible_host=172.20.0.31

[namenode]
master1

[secondary_namenode]
master2

[resourcemanager]
master1

[datanodes]
worker1
worker2

[spark_master]
master1

[spark_workers]
worker1
worker2

[zookeeper]
master1

[kafka]
master1

[hive]
master2

[hbase_master]
master2

[hbase_regionservers]
worker1
worker2

[atlas]
master2

[ranger]
master2

[nifi]
edge

[phoenix]
edge

[monitoring]
edge

[cluster:children]
masters
workers
edge
