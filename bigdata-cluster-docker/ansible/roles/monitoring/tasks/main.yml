---
- name: Vérifier Prometheus pré-installé
  stat:
    path: "{{ install_dir }}/prometheus/prometheus"
  register: prom_bin

- name: Télécharger Prometheus si absent
  block:
    - get_url:
        url:     "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest:    "/tmp/prometheus.tar.gz"
        timeout: 120
    - unarchive:
        src:        "/tmp/prometheus.tar.gz"
        dest:       "{{ install_dir }}/"
        remote_src: yes
    - file:
        src:   "{{ install_dir }}/prometheus-{{ prometheus_version }}.linux-amd64"
        dest:  "{{ install_dir }}/prometheus"
        state: link
  when: not prom_bin.stat.exists

- name: node_exporter service
  copy:
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target
      [Service]
      User={{ hadoop_user }}
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/node_exporter.service

- name: Activer node_exporter
  systemd:
    name:         node_exporter
    enabled:      yes
    state:        started
    daemon_reload: yes
  ignore_errors: yes

- name: prometheus.yml
  template:
    src:  prometheus.yml.j2
    dest: "{{ install_dir }}/prometheus/prometheus.yml"

- name: Service Prometheus
  template:
    src:  prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service

- name: Activer Prometheus
  systemd:
    name:         prometheus
    enabled:      yes
    state:        started
    daemon_reload: yes
  ignore_errors: yes

- name: Activer Grafana
  systemd:
    name:         grafana-server
    enabled:      yes
    state:        started
    daemon_reload: yes
  ignore_errors: yes
