[desktop]
secret_key=hue_secret_key_change_me_in_production
http_host=0.0.0.0
http_port=8888
time_zone=Africa/Tunis
app_blacklist=
django_debug_mode=false
gunicorn_work_class=sync

[[database]]
engine=postgresql_psycopg2
host=postgres
port=5432
user=hue
password=hue
name=hue

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://namenode:9000
webhdfs_url=http://namenode:9870/webhdfs/v1
hadoop_conf_dir=/opt/hadoop/etc/hadoop

[[yarn_clusters]]
[[[default]]]
resourcemanager_host=resourcemanager
resourcemanager_port=8032
submit_to=True
resourcemanager_api_url=http://resourcemanager:8088
proxy_api_url=http://resourcemanager:8088
history_server_api_url=http://historyserver:8188

[beeswax]
hive_server_host=hiveserver2
hive_server_port=10000
hive_configuration_directory=/opt/hive/conf
server_conn_timeout=120
