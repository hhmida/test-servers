version: '3.8'

services:
  # ==================== HADOOP ====================
  namenode:
    image: apache/hadoop:3.4.2
    container_name: namenode
    hostname: namenode
    user: root
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/opt/hadoop/dfs/name
      - ./config:/opt/hadoop/etc/hadoop
    environment:
      - CLUSTER_NAME=test
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ ! -d /opt/hadoop/dfs/name/current ]; then
          echo ">>> Formatting NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi
        echo ">>> Starting NameNode..."
        exec hdfs namenode
    networks:
      - hadoop

  datanode1:
    image: apache/hadoop:3.4.2
    container_name: datanode1
    hostname: datanode1
    user: root
    restart: always
    volumes:
      - hadoop_datanode1:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  datanode2:
    image: apache/hadoop:3.4.2
    container_name: datanode2
    hostname: datanode2
    user: root
    restart: always
    volumes:
      - hadoop_datanode2:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  datanode3:
    image: apache/hadoop:3.4.2
    container_name: datanode3
    hostname: datanode3
    user: root
    restart: always
    volumes:
      - hadoop_datanode3:/opt/hadoop/dfs/data
      - ./config:/opt/hadoop/etc/hadoop
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    networks:
      - hadoop

  resourcemanager:
    image: apache/hadoop:3.4.2
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    restart: always
    ports:
      - "8088:8088"
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
      - ./jars/commons-collections-3.2.2.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections4-4.4.jar
    command: ["yarn", "resourcemanager"]
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
    networks:
      - hadoop

  nodemanager1:
    image: apache/hadoop:3.4.2
    container_name: nodemanager1
    hostname: nodemanager1
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
      - ./jars/commons-collections-3.2.2.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections4-4.4.jar
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager2:
    image: apache/hadoop:3.4.2
    container_name: nodemanager2
    hostname: nodemanager2
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
      - ./jars/commons-collections-3.2.2.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections4-4.4.jar
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  nodemanager3:
    image: apache/hadoop:3.4.2
    container_name: nodemanager3
    hostname: nodemanager3
    user: root
    restart: always
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
      - ./jars/commons-collections-3.2.2.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hadoop/share/hadoop/common/lib/commons-collections4-4.4.jar
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  historyserver:
    image: apache/hadoop:3.4.2
    container_name: historyserver
    hostname: historyserver
    user: root
    restart: always
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/opt/hadoop/yarn/timeline
      - ./config:/opt/hadoop/etc/hadoop
    command: ["yarn", "timelineserver"]
    depends_on:
      - resourcemanager
    networks:
      - hadoop

  # ==================== POSTGRES ====================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hadoop

  # ==================== HIVE ====================
  hive-metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    hostname: hive-metastore
    user: root
    restart: always
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./config:/opt/hive/conf
      - ./jars/postgresql.jar:/opt/hive/lib/postgresql.jar
      - ./jars/commons-collections-3.2.2.jar:/opt/hive/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hive/lib/commons-collections4-4.4.jar
      - hive_warehouse:/opt/hive/data/warehouse
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started
    ports:
      - "9083:9083"
    networks:
      - hadoop

  hiveserver2:
    image: apache/hive:4.0.1
    container_name: hiveserver2
    hostname: hiveserver2
    user: root
    restart: always
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    volumes:
      - ./config:/opt/hive/conf
      - ./jars/postgresql.jar:/opt/hive/lib/postgresql.jar
      - ./jars/commons-collections-3.2.2.jar:/opt/hive/lib/commons-collections-3.2.2.jar
      - ./jars/commons-collections4-4.4.jar:/opt/hive/lib/commons-collections4-4.4.jar
      - hive_warehouse:/opt/hive/data/warehouse
    depends_on:
      - hive-metastore
      - namenode
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - hadoop

  # ==================== HUE ====================
  hue:
    image: gethue/hue:4.11.0
    container_name: hue
    hostname: hue
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - ./config/hue.ini:/usr/share/hue/desktop/conf/hue.ini
    depends_on:
      - postgres
      - hiveserver2
      - namenode
      - resourcemanager
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Postgres..."
        sleep 15
        ./build/env/bin/hue migrate
        ./build/env/bin/hue runserver 0.0.0.0:8888
    networks:
      - hadoop

  # ==================== TOOLS (Pig + Sqoop client) ====================
  tools:
    image: apache/hadoop:3.4.2
    container_name: tools
    hostname: tools
    user: root
    stdin_open: true
    tty: true
    volumes:
      - ./config:/opt/hadoop/etc/hadoop
      - ./jars:/jars
    entrypoint: ["bash"]
    depends_on:
      - namenode
      - hiveserver2
    networks:
      - hadoop

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  hadoop_historyserver:
  postgres_data:
  hive_warehouse:

networks:
  hadoop:
    driver: bridge
