version: '3.9'

networks:
  ambari-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  bigtop_hostname0:
    container_name: bigtop_hostname0
    hostname: bigtop_hostname0
    command: /sbin/init
    domainname: bigtop.apache.org
    image: bigtop/puppet:trunk-rockylinux-8
    mem_limit: 8g
    mem_swappiness: 0
    ports:
      - "8080:8080"
    privileged: true
    networks:
      ambari-network:
        ipv4_address: 172.20.0.2
    volumes:
      - ./ambari-repo:/var/repo/ambari
      - ./conf/hosts:/etc/hosts

  bigtop_hostname1:
    container_name: bigtop_hostname1
    hostname: bigtop_hostname1
    command: /sbin/init
    domainname: bigtop.apache.org
    image: bigtop/puppet:trunk-rockylinux-8
    mem_limit: 8g
    mem_swappiness: 0
    privileged: true
    networks:
      ambari-network:
        ipv4_address: 172.20.0.3
    volumes:
      - ./ambari-repo:/var/repo/ambari
      - ./conf/hosts:/etc/hosts
    depends_on:
      - bigtop_hostname0

  bigtop_hostname2:
    container_name: bigtop_hostname2
    hostname: bigtop_hostname2
    command: /sbin/init
    domainname: bigtop.apache.org
    image: bigtop/puppet:trunk-rockylinux-8
    mem_limit: 8g
    mem_swappiness: 0
    privileged: true
    networks:
      ambari-network:
        ipv4_address: 172.20.0.4
    volumes:
      - ./ambari-repo:/var/repo/ambari
      - ./conf/hosts:/etc/hosts
    depends_on:
      - bigtop_hostname0

  bigtop_hostname3:
    container_name: bigtop_hostname3
    hostname: bigtop_hostname3
    command: /sbin/init
    domainname: bigtop.apache.org
    image: bigtop/puppet:trunk-rockylinux-8
    mem_limit: 8g
    mem_swappiness: 0
    privileged: true
    networks:
      ambari-network:
        ipv4_address: 172.20.0.5
    volumes:
      - ./ambari-repo:/var/repo/ambari
      - ./conf/hosts:/etc/hosts
    depends_on:
      - bigtop_hostname0